function localize(root){
  if(state.language!=='en') return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  for(let node=walker.nextNode();node;node=walker.nextNode()){
    const key=node.data.trim();
    if(translations[key]) node.data=node.data.replace(key,translations[key]);
  }
  for(const el of root.querySelectorAll('[aria-label],[title],[placeholder]')){
    for(const attr of ['aria-label','title','placeholder']){
      const value=el.getAttribute(attr);
      if(translations[value]) el.setAttribute(attr,translations[value]);
    }
  }
}

function searchResults(){
  const source=state.searchMode==='Tên đường'?roads:[...places,...roads];
  const matches=state.query?source.filter(name=>fold(name).includes(fold(state.query))):source.slice(0,5);
  return row(choices('searchMode',['Tất cả','Tên đường']),action('run-search','Tìm địa điểm quanh đây','chip'),action('run-search','Tìm dọc tuyến','chip','along'))+
    (matches.length?matches.map(name=>action('show-place',name,'quiet',name)).join(''):muted('Không có gợi ý trong dữ liệu mẫu'))+
    (state.query?action('road-search','Tìm tên đường, bỏ số nhà'):'');

function departureEstimate(duration){
  if(state.departure==='Đi ngay') return '';
  const [hours,minutes]=state.hour.split(':').map(Number);
  const arrive=state.departure==='Đến lúc';
  const shifted=(hours*60+minutes+(arrive?-duration:duration)+1440)%1440;
  const time=[Math.floor(shifted/60),shifted%60].map(value=>String(value).padStart(2,'0')).join(':');
  return (arrive?'Nên khởi hành lúc ':'Dự kiến đến lúc ')+time;
}

function storeRoute(multi=false){

  const origin=multi?state.multiOrigin:state.origin;
  const destination=multi?(state.roundtrip?state.multiOrigin:state.multiStops.at(-1)):(state.destination);
  const note=multi?'Nhiều điểm · 3,8 km · 11 phút':(vehicle==='bike'?'Xe máy':'Ô tô')+' · '+item.km+' km · '+item.min+' phút';
  if(!state.saved.some(entry=>entry.origin===origin&&entry.destination===destination&&entry.note===note)){
    state.saved.unshift({id:state.nextSavedId++,origin,destination,note});
  }
  announce('Đã lưu hành trình mẫu');

function changePoint(value){
  const [scope,raw,move]=value.split('|');
  const items=scope==='multi'?state.multiStops:state.waypoints;
  const index=Number(raw);
  if(move==='remove') items.splice(index,1);
  else {
    const newIndex=index+(move==='up'?-1:1);
    if(newIndex>=0&&newIndex<items.length) [items[index],items[newIndex]]=[items[newIndex],items[index]];
  }
  if(scope==='route') state.routeReady=false;
  else state.optimized=false;
  render();

  state.term=term;

document.addEventListener('submit',event=>{

  const data=new FormData(event.target);
  if(type==='auth'){
    state.member=true;closeModal();render();announce('Đã vào phiên thành viên mô phỏng');
  }else if(type==='route'){
    state.origin=String(data.get('origin')).trim();state.destination=String(data.get('destination')).trim();
    if(!state.origin||!state.destination||fold(state.origin)===fold(state.destination)){announce('Chọn điểm đi và điểm đến khác nhau');return;}

    choosePane('directions');announce('Đã hiển thị 3 tuyến mẫu');
  }else if(type==='multi'){
    if(event.submitter===null&&String(data.get('newStop')).trim()){addMultiStop();return;}
    if(state.multiStops.length<2){announce('Thêm ít nhất 2 điểm dừng để tối ưu');return;}
    state.multiOrigin=String(data.get('multiOrigin')).trim();state.optimized=true;render();

    metro:()=>'<aside class="metro-main">'+(alternate?featurePane():'<div class="metro-heading">'+brand()+title()+'</div>'+placePair()+row(modes(),paneButton('plan','Sửa hành trình')))+'</aside>'+map()+(alternate?'':'<section class="metro-bar">'+routes()+tripActions()+'</section>'),
    night:()=>map()+(alternate?'':'<div class="night-hud"><div class="night-command">'+brand()+'<p class="muted">'+esc(state.destination)+'</p></div><div class="night-command"><div class="heading-row">'+estimate()+control('pane','Sửa hành trình','edit','plan')+'</div></div></div>')+'<section class="night-options">'+(alternate?featurePane():modes()+routes()+tripActions())+'</section>',
    postcard:()=>map()+'<section class="letter">'+(alternate?featurePane():brand()+'<h1>'+esc(state.destination)+'</h1>'+placePair()+modes()+routes()+tripActions())+'</section>',
    mosaic:()=>'<section class="mosaic-intro">'+(alternate?featurePane():brand()+title()+placePair()+modes())+'</section>'+map()+(alternate?'':'<section class="mosaic-routes"><h2>Các tuyến có thể đi</h2>'+routes()+'</section><section class="mosaic-action">'+estimate()+tripActions()+'</section>'),
    pocket:()=>'<header class="pocket-top">'+brand()+'<h1>'+esc(state.destination)+'</h1></header>'+map()+'<section class="pocket-strip">'+(alternate?featurePane():'<div class="pocket-summary"><div><strong>'+item.min+' phút</strong> '+item.km+' km</div>'+action('pocket-routes',pocketExpanded?'Thu gọn':'So sánh 3 tuyến')+'</div>'+modes()+(pocketExpanded?routes():'')+tripActions())+'</section>'
  };
  stage.innerHTML=templates[concept]();
  renderToolbar();
  localize(stage);
  stage.querySelectorAll('details summary').forEach(el=>{if(openDetails.includes(el.textContent))el.parentElement.open=true;});
  if(samePane&&stage.querySelector('.demo-pane')) stage.querySelector('.demo-pane').scrollTop=priorScroll;
  observer.disconnect();
  observer.observe(stage.querySelector('.map'));
  draw();
  if(focusSelector) stage.querySelector(focusSelector)?.focus({preventScroll:true});
}
function announce(text){
  notice.textContent=tr(text);
  clearTimeout(noticeTimer);
  noticeTimer=setTimeout(()=>notice.textContent='',2600);
}
function changeConcept(key){
  if(!key||key===concept) return;
  concept=key;
  zoom=1;
  expanded=false;
  render();
}
picker.addEventListener('click',event=>changeConcept(event.target.closest('[data-concept]')?.dataset.concept));
stage.addEventListener('click',event=>{
  const target=event.target.closest('button');
  if(!target) return;
  if(target.dataset.route!==undefined){
    route=Number(target.dataset.route);
    render('[data-route="'+route+'"]');
    return;
  }
  if(target.dataset.vehicle){
    vehicle=target.dataset.vehicle;
    render('[data-vehicle="'+vehicle+'"]');
    return;
  }
  switch(target.dataset.action){
    case 'zoom-in': zoom=Math.min(1.7,zoom+.15);draw();break;
    case 'zoom-out': zoom=Math.max(.60,zoom-.15);draw();break;
    case 'more': expanded=!expanded;render('[data-action="more"]');break;
    case 'vehicle':
      vehicle=vehicle==='bike'?'car':'bike';
      render('[data-action="vehicle"]');
      break;
    case 'start': startNavigation();break;
  }
});
const themes={
  atlas:{ground:'#ebe9df',block:'#e0dfd5',street:'#faf8ef',main:'#ffd9a2',edge:'#cfba97',water:'#b9d7d9',park:'#cbdac4',label:'#616c62',alt:'#758cba'},
  float:{ground:'#e8eee2',block:'#dce7d9',street:'#f7fbf3',main:'#f3dcac',edge:'#d6c599',water:'#b5d8dc',park:'#bdd8b6',label:'#4d6a59',alt:'#799a87'},
  dispatch:{ground:'#222d35',block:'#27343d',street:'#40505a',main:'#6e6950',edge:'#313d44',water:'#172f43',park:'#26423b',label:'#b2c2bd',alt:'#647988'},
  deck:{ground:'#ede4d6',block:'#e4d9c9',street:'#fcf4e8',main:'#efc998',edge:'#cbb396',water:'#b8d4d4',park:'#c3d3ad',label:'#695c50',alt:'#a58d86'},
  focus:{ground:'#e8e4f0',block:'#ded9e9',street:'#f9f6ff',main:'#e7d2bd',edge:'#cbbbc6',water:'#bcc7e6',park:'#cbd8d4',label:'#665f7b',alt:'#958ab2'},

  postcard:{ground:'#f3e2db',block:'#e8d5d0',street:'#fff6ef',main:'#edc8a5',edge:'#ccb2a2',water:'#b1d4d6',park:'#cad0a9',label:'#755965',alt:'#a68796'},
  mosaic:{ground:'#e3eff1',block:'#d5e4e7',street:'#f6fcfc',main:'#eccda0',edge:'#c8bda7',water:'#a8d0ed',park:'#bcdbc8',label:'#446774',alt:'#7495a9'},
  pocket:{ground:'#e3ede0',block:'#d5e4d8',street:'#f5faf0',main:'#e8d4a4',edge:'#c8bca2',water:'#acd2d5',park:'#bad5b3',label:'#466658',alt:'#819b8e'},
  satellite:{ground:'#354336',block:'#455246',street:'#647161',main:'#968d62',edge:'#2a3a30',water:'#173c4c',park:'#2a5740',label:'#f0f2de',alt:'#a3ac90'}
};
const paths=[
  [[402,531],[465,505],[516,464],[553,456],[582,417],[594,374],[647,347]],
  [[402,531],[415,476],[439,423],[474,397],[527,367],[561,333],[601,328],[647,347]],
  [[402,531],[461,548],[533,540],[602,484],[647,437],[656,391],[647,347]]
];
const arterials=[
  [[-120,413],[99,383],[232,421],[402,531],[465,505],[516,464],[553,456],[582,417],[594,374],[647,347],[716,308],[818,190],[1060,113],[1320,76]],
  [[247,850],[316,719],[369,607],[402,531],[415,476],[439,423],[474,397],[527,367],[561,333],[601,328],[647,347],[717,374],[780,359],[894,284],[1300,217]],
  [[-100,647],[126,634],[243,602],[333,567],[402,531],[461,548],[533,540],[602,484],[647,437],[656,391],[647,347],[632,279],[670,157],[767,-50]],
  [[-80,171],[159,152],[316,193],[405,237],[510,290],[561,333],[594,374],[656,391],[735,407],[809,450],[1167,549]],
  [[-70,776],[195,748],[329,779],[452,746],[521,668],[617,617],[698,610],[821,529],[911,463],[1289,469]]
];
function cityLine(ctx,points,color,width){
  ctx.beginPath();
  points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.lineWidth=width;
  ctx.strokeStyle=color;
  ctx.stroke();
}
function shape(ctx,points,color){
  ctx.beginPath();
  points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.closePath();
  if(color){ctx.fillStyle=color;ctx.fill();}
}
function district(ctx,points,origin,angle,theme,step){
  ctx.save();
  shape(ctx,points);
  ctx.clip();
  ctx.translate(...origin);
  ctx.rotate(angle);
  for(let row=-25;row<=25;row++){
    for(let col=-25;col<=25;col++){
      const x=col*step,y=row*step*.81;
      if((row*13+col*17)%7===0){
        ctx.fillStyle=theme.park;
        ctx.fillRect(x+2,y+2,step-4,step*.81-4);
      }else{
        ctx.fillStyle=theme.block;
        const gap=(row*row+col*col)%5+2;
        ctx.fillRect(x+gap,y+3,step-gap-3,step*.81-6);
        if((row+col)%3===0){
          ctx.fillStyle=theme.ground;
          ctx.fillRect(x+step*.43,y+4,3,step*.81-8);
        }
      }
    }
  }
  for(let i=-25;i<=25;i++){
    const shift=i%4===1?3:0;
    cityLine(ctx,[[i*step+shift,-1300],[i*step+shift,1300]],theme.street,i%5===0?4.5:2.2);
    cityLine(ctx,[[-1300,i*step*.81],[1300,i*step*.81]],theme.street,i%5===0?4.5:2.2);
  }
  ctx.restore();
}
function label(ctx,text,x,y,size,ink,halo,angle=0,weight=600){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.font=weight+' '+size+'px system-ui, sans-serif';
  ctx.textAlign='center';
  ctx.lineJoin='round';
  if(halo){
    ctx.strokeStyle=halo;
    ctx.lineWidth=3;
    ctx.strokeText(text,0,0);
  }
  ctx.fillStyle=ink;
  ctx.fillText(text,0,0);
  ctx.restore();
}
function marker(ctx,x,y,text,fill,dark){
  ctx.save();ctx.shadowColor='#15192044';ctx.shadowBlur=5;
  ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=dark?'#141c24':'#fff';ctx.stroke();
  ctx.restore();label(ctx,text,x,y+4,11,dark?'#10251e':'#fff',null,0,800);
}
function drawOverview(ctx,width,height,theme,accent){
  ctx.fillStyle=theme.water;
  ctx.fillRect(0,0,width,height);
  const scale=Math.min(width/350,height/560)*zoom;
  ctx.translate(width/2,height/2);
  ctx.scale(scale,scale);
  ctx.translate(-160,-260);
  const outline=[[149,41],[180,31],[199,48],[228,48],[215,66],[239,74],[223,95],[206,91],[189,116],[174,116],[161,149],[164,174],[188,202],[211,221],[225,253],[253,275],[263,304],[254,330],[265,354],[251,391],[222,408],[207,431],[171,447],[151,471],[123,491],[112,480],[113,452],[139,439],[138,415],[162,390],[184,375],[191,346],[198,318],[188,286],[172,269],[160,246],[140,223],[126,192],[114,160],[112,134],[132,108],[121,86],[97,71],[108,50],[135,54]];
  shape(ctx,outline,theme.park);
  label(ctx,'VIỆT NAM',42,280,17,theme.label,theme.water,0,800);
  for(const [x,y,name] of [[173,88,'Hà Nội'],[230,260,'Đà Nẵng'],[166,429,'TP.HCM']]){
    ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
    label(ctx,name,x+27,y-8,13,theme.label,theme.water,0,700);
  }
  label(ctx,'Sơ đồ minh họa',150,523,12,theme.label,theme.water);
}
function draw(){
  const canvas=stage.querySelector('canvas');
  if(!canvas) return;
  const {width,height}=canvas.getBoundingClientRect();
  if(!width || !height) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const pxWidth=Math.round(width*dpr),pxHeight=Math.round(height*dpr);
  if(canvas.width!==pxWidth || canvas.height!==pxHeight){canvas.width=pxWidth;canvas.height=pxHeight;}
  const ctx=canvas.getContext('2d');
  const theme=themes[state.base==='Vệ tinh'?'satellite':state.autoDark?'dispatch':concept];
  const accent=getComputedStyle(stage).getPropertyValue('--accent').trim();
  const dark=['dispatch','night'].includes(concept);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=theme.ground;
  ctx.fillRect(0,0,width,height);
  const scale=Math.min(Math.max(width/1040,height/850),width/305,height/275)*zoom;
  if(state.zoomMode==='country'){drawOverview(ctx,width,height,theme,accent);return;}
  const shiftX=concept==='float'&&width>650?width*.13:0;
  const shiftY=concept==='float'&&width<=650?-height*.16:0;
  ctx.translate(width*.5+shiftX,height*.5+shiftY);
  ctx.scale(scale,scale);
  ctx.translate(-536,-444);
  ctx.lineJoin='round';
  ctx.lineCap='round';
  district(ctx,[[-800,-900],[632,-900],[610,230],[525,318],[319,228],[-800,429]],[300,230],-.28,theme,34);
  district(ctx,[[-800,429],[319,228],[525,318],[590,376],[475,567],[263,599],[-800,720]],[414,485],.4,theme,30);
  district(ctx,[[525,318],[610,230],[632,-900],[1700,-900],[1700,433],[730,471],[591,376]],[630,357],-.53,theme,27);
  district(ctx,[[-800,720],[263,599],[475,567],[591,376],[730,471],[1700,433],[1700,1700],[-800,1700]],[535,605],.33,theme,34);
  shape(ctx,[[207,389],[263,368],[301,420],[249,443]],theme.park);
  shape(ctx,[[466,323],[501,305],[523,332],[487,352]],theme.park);
  shape(ctx,[[609,238],[658,220],[690,254],[654,279]],theme.park);
  shape(ctx,[[736,500],[773,548],[732,573],[699,535]],theme.park);
  ctx.beginPath();
  ctx.moveTo(1020,-600);
  ctx.bezierCurveTo(626,18, 1054,99, 892,304);
  ctx.bezierCurveTo(790,437, 718,483, 864,552);
  ctx.bezierCurveTo(992,611, 923,717, 791,785);
  ctx.bezierCurveTo(640,869, 654,1024, 892,1370);
  ctx.bezierCurveTo(729,1024, 742,900, 834,844);
  ctx.bezierCurveTo(1028,745, 1119,608, 925,514);
  ctx.bezierCurveTo(820,465, 867,437, 963,340);
  ctx.bezierCurveTo(1125,171, 804,99, 1095,-600);
  ctx.closePath();ctx.fillStyle=theme.water;ctx.fill();
  for(const line of arterials){
    cityLine(ctx,line,theme.edge,12);
    cityLine(ctx,line,theme.main,8);
  }
  label(ctx,'QUẬN 3',305,272,12,theme.label,theme.ground,0,750);
  label(ctx,'QUẬN 1',571,257,12,theme.label,theme.ground,0,750);
  label(ctx,'BẾN NGHÉ',715,281,14,theme.label,theme.ground,0,750);
  label(ctx,'BẾN THÀNH',386,461,12,theme.label,theme.ground,0,750);
  label(ctx,'THỦ THIÊM',1015,418,13,theme.label,theme.ground,0,750);
  label(ctx,'Sông Sài Gòn',933,618,13,theme.label,theme.water,.62,550);
  label(ctx,'Công viên Tao Đàn',266,407,11,theme.label,theme.park,0,650);
  label(ctx,'Nguyễn Thị Minh Khai',364,213,11,theme.label,theme.ground,.33,550);
  label(ctx,'Lê Lợi',500,484,10,theme.label,theme.ground,-.55,650);
  label(ctx,'Pasteur',666,474,10,theme.label,theme.ground,-.74,650);
  if(state.terrain&&state.base==='Bản đồ'){
    ctx.save();ctx.globalAlpha=.34;
    for(let i=0;i<5;i++){
      ctx.beginPath();ctx.ellipse(310,322,62+i*14,28+i*9,-.38,0,Math.PI*2);
      ctx.strokeStyle=theme.label;ctx.lineWidth=1;ctx.stroke();
    }
    ctx.restore();
  }
  if(state.routeReady){
    paths.forEach((path,index)=>{
      if(index===route) return;
      cityLine(ctx,path,theme.street,7.5);
      cityLine(ctx,path,theme.alt,4.5);
    });
    cityLine(ctx,paths[route],dark?'#10251e':'#fff',11);
    cityLine(ctx,paths[route],accent,7.2);
    if(traffic){
      cityLine(ctx,paths[route].slice(2,4),'#ffac42',5.4);
      cityLine(ctx,paths[route].slice(4,6),'#e76857',5.4);
    }
    if(navigating||state.pin){
      const [x,y]=paths[route][2];
      ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();ctx.lineWidth=2.8;ctx.strokeStyle=theme.street;ctx.stroke();
    }
    marker(ctx,402,531,'A',accent,dark);
    marker(ctx,647,347,'B',accent,dark);
    label(ctx,state.origin,391,560,13,theme.label,theme.ground,0,750);
    label(ctx,state.destination,657,318,13,theme.label,theme.ground,0,750);
  }
  if(state.pane==='multi'&&state.optimized){
    const visit=[[402,531],[442,384],[523,304],[647,347]];
    cityLine(ctx,visit,accent,5);
    visit.forEach(([x,y],index)=>marker(ctx,x,y,index+1,accent,dark));
  }
  if(state.incidents){
    if(traffic){
      ctx.beginPath();ctx.arc(611,473,28,0,Math.PI*2);ctx.fillStyle='#e7685755';ctx.fill();
    }
    marker(ctx,611,473,'!','#b5412f',false);
  }
  if(state.pin&&!state.routeReady) marker(ctx,515,462,'•',accent,dark);
}
const observer=new ResizeObserver(draw);
render();
